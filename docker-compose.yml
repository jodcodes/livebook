services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: livebook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: livebook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - livebook-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d livebook"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  livebook-postgres-data:
