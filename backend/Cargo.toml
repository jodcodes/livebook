[package]
name = "backend"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
axum = { version = "0.8.1", features = ["multipart"] }
tokio = { version = "1.44.2", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
chrono = { version = "0.4.42", default-features = true, features = ["clock"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
utoipa = "5.3.1"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
pdf-extract = "0.10.0"
deadpool-postgres = "0.14.1"
tokio-postgres = { version = "0.7.12", features = ["with-chrono-0_4", "with-serde_json-1"] }
pgvector = { version = "0.4.0", features = ["postgres"] }
uuid = { version = "1.18.1", features = ["v4"] }
